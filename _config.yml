# ===== 主题 =====
# GitHub Pages 传统构建不支持 gem 形式的 minimal-mistakes，用 remote_theme 引同一个版本
remote_theme           : "mmistakes/minimal-mistakes@4.28.1"
# 配色皮肤，可换: "air" "aqua" "contrast" "dark" "dirt" "neon" "mint" "plum" "sunrise"
#                "catppuccin_latte" "catppuccin_mocha"
minimal_mistakes_skin  : "default"

# ===== 站点信息 =====
locale                 : "en-US"
title                  : "Ning Yang"
title_separator        : "-"
subtitle               : "RTEMS · BSP · Embedded Systems"
name                   : "Ning Yang"
description            :
url                    : "https://yangn0.github.io"
baseurl                : ""
repository             : "yangn0/yangn0.github.io"
teaser                 :
logo                   :
masthead_title         :
breadcrumbs            : false
words_per_minute       : 200
enable_copy_code_button: true
copyright              : "Ning Yang"
copyright_url          : "https://yangn0.github.io"

comments:
  provider             : false

atom_feed:
  path                 :

# 站内搜索（lunr，纯前端，不需要额外服务）
search                 : true
search_full_content    : true
search_provider        : lunr

og_image               :

social:
  type                 : Person
  name                 : "Ning Yang"
  links:
    - "https://github.com/yangn0"

analytics:
  provider             : false

# ===== 作者（显示在文章页/首页左侧栏）=====
author:
  name                 : "Ning Yang"
  avatar               : "/picture/avatar.jpg"
  bio                  :
  location             : "China"
  email                :
  links:
    - label            : "GitHub"
      icon             : "fab fa-fw fa-github"
      url              : "https://github.com/yangn0"

# ===== 页脚 =====
footer:
  links:
    - label            : "GitHub"
      icon             : "fab fa-fw fa-github"
      url              : "https://github.com/yangn0"
    - label            : "RSS"
      icon             : "fas fa-fw fa-rss-square"
      url              : "/feed.xml"
  since                : "2024"

# ===== 读取 =====
include:
  - .htaccess
exclude:
  - Gemfile
  - Gemfile.lock
  - gemfiles
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .bundle
  - .jekyll-cache
  - .sass-cache
  - README.md
  - PUBLISHING.md
  - new-post.sh
  - publish.sh
  - serve.sh
  - .gitignore
  - .github
keep_files:
  - .git
encoding               : "utf-8"
markdown_ext           : "markdown,mkdown,mkdn,mkd,md"

# ===== 转换 =====
markdown               : kramdown
highlighter            : rouge
lsi                    : false
excerpt_separator      : "\n\n"
incremental            : false

kramdown:
  input                : GFM
  hard_wrap            : false
  auto_ids             : true
  footnote_nr          : 1
  entity_output        : as_char
  toc_levels           : 1..6
  smart_quotes         : lsquo,rsquo,ldquo,rdquo
  enable_coderay       : false

sass:
  sass_dir             : _sass
  style                : compressed

# ===== 输出 =====
# 保持现有文章 URL 不变（minimal-mistakes 默认是 /:categories/:title/）
permalink              : /:year/:month/:day/:title/
timezone               : Asia/Shanghai

paginate               : 5
paginate_path          : /page:num/

# ===== 插件（都用 GitHub Pages 白名单内的）=====
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme
  - jekyll-redirect-from

# ===== 归档页 =====
category_archive:
  type                 : liquid
  path                 : /categories/
tag_archive:
  type                 : liquid
  path                 : /tags/

compress_html:
  clippings            : all
  ignore:
    envs               : development

# ===== 默认值 =====
defaults:
  - scope:
      path             : ""
      type             : posts
    values:
      layout           : single
      author_profile   : true
      read_time        : true
      comments         : false
      share            : true
      related          : true
  - scope:
      path             : ""
      type             : pages
    values:
      layout           : single
